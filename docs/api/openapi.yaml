openapi: "3.1.0"
info:
  title: "API de turnos del consultorio odontológico"
  version: "1.0.0"
  description: "Contrato de la API REST del MVP (fuente única de verdad, AGENTS.md regla 5). Instantes ISO-8601 con offset -03:00, fechas YYYY-MM-DD, ids enteros, campos en camelCase. Errores con formato uniforme y `codigo` estable: ver `docs/api/errores.md`. Los ejemplos de `docs/api/ejemplos/` son los mocks del front. El token del turno nunca viaja en una respuesta de la API."
  license:
    name: "Uso académico (TP Metodología I)"
    identifier: LicenseRef-TP
servers:
  - url: "/"
    description: "Mismo origen que el front (proxy nginx / Vite)."
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: "Login y usuario autenticado."
  - name: "Público"
    description: "Área pública sin cuenta: reserva y gestión por token."
  - name: Prestaciones
    description: "Catálogo de prestaciones (odontólogo)."
  - name: "Horarios de atención"
    description: "Rangos de atención semanales (odontólogo)."
  - name: Bloqueos
    description: "Bloqueos puntuales de agenda con vista previa."
  - name: Pacientes
    description: "Pacientes del consultorio."
  - name: Turnos
    description: "Agenda y acciones sobre turnos."
  - name: Disponibilidad
    description: "Horarios libres para carga manual."
paths:
  "/api/auth/login":
    post:
      tags: [Auth]
      operationId: auth_login
      summary: "Iniciar sesión"
      description: "Valida email y contraseña del odontólogo y devuelve un JWT. Con credenciales inválidas responde 401 `CREDENCIALES_INVALIDAS` con el mismo mensaje para email inexistente o contraseña incorrecta."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/auth-login.request.json"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/auth-login.200.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "401":
          description: "Credenciales inválidas."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                credenciales-invalidas:
                  summary: CREDENCIALES_INVALIDAS
                  externalValue: "./ejemplos/auth-login.401-credenciales-invalidas.json"
  "/api/auth/me":
    get:
      tags: [Auth]
      operationId: auth_me
      summary: "Usuario autenticado"
      description: "Devuelve los datos del odontólogo dueño del JWT."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Usuario"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/auth-me.200.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
  "/api/public/prestaciones":
    get:
      tags: ["Público"]
      operationId: prestaciones_publicas_listar
      summary: "Listar prestaciones activas"
      description: "Prestaciones activas para elegir en la página de reserva. No requiere autenticación."
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/PrestacionPublica"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/prestaciones-publicas-listar.200.json"
  "/api/public/disponibilidad":
    get:
      tags: ["Público"]
      operationId: disponibilidad_publica
      summary: "Horarios libres por día (público)"
      description: "Horarios libres de una prestación en el rango `desde`..`hasta` (inclusivos, `hasta >= desde`, máximo 31 días). Un solo día se pide con `desde = hasta`. La respuesta trae un elemento por cada fecha del rango (con `horarios: []` si no hay lugar). Aplica la ventana pública: al menos 2 h y hasta 60 días hacia adelante."
      security: []
      parameters:
        - "$ref": "#/components/parameters/PrestacionId"
        - "$ref": "#/components/parameters/Desde"
        - "$ref": "#/components/parameters/Hasta"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Disponibilidad"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/disponibilidad-publica.200.json"
        "400":
          "$ref": "#/components/responses/Validacion"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "422":
          description: "Regla de negocio violada. `PRESTACION_INACTIVA`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                prestacion-inactiva:
                  summary: PRESTACION_INACTIVA
                  externalValue: "./ejemplos/disponibilidad-publica.422-prestacion-inactiva.json"
  "/api/public/turnos":
    post:
      tags: ["Público"]
      operationId: turnos_publico_reservar
      summary: "Reservar un turno"
      description: "Crea el turno sin cuenta. Responde 201 con el resumen público: `PENDIENTE` si faltan 24 h o más, `CONFIRMADO` si faltan menos. `consentimiento` es obligatorio (con `false`: 422). El token del turno viaja solo en el email, nunca en esta respuesta."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReservaPublicaRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/turnos-publico-reservar.request.json"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurnoResumenPublico"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/turnos-publico-reservar.201.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "409":
          description: "Conflicto. `HORARIO_OCUPADO`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                horario-ocupado:
                  summary: HORARIO_OCUPADO
                  externalValue: "./ejemplos/turnos-publico-reservar.409-horario-ocupado.json"
        "422":
          description: "Regla de negocio violada. `HORARIO_NO_DISPONIBLE`, `CONSENTIMIENTO_REQUERIDO`, `PRESTACION_INACTIVA`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                horario-no-disponible:
                  summary: HORARIO_NO_DISPONIBLE
                  externalValue: "./ejemplos/turnos-publico-reservar.422-horario-no-disponible.json"
                consentimiento-requerido:
                  summary: CONSENTIMIENTO_REQUERIDO
                  externalValue: "./ejemplos/turnos-publico-reservar.422-consentimiento-requerido.json"
                prestacion-inactiva:
                  summary: PRESTACION_INACTIVA
                  externalValue: "./ejemplos/turnos-publico-reservar.422-prestacion-inactiva.json"
  "/api/public/turnos/{token}":
    get:
      tags: ["Público"]
      operationId: turnos_publico_obtener
      summary: "Resumen del turno por token"
      description: "Solo lectura: no cambia el estado del turno (los clientes de mail abren los links solos). No incluye DNI, apellido, email, teléfono, ids ni el token. `puedeConfirmar` y `puedeCancelar` los calcula el backend."
      security: []
      parameters:
        - "$ref": "#/components/parameters/Token"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurnoResumenPublico"
              examples:
                pendiente:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/turnos-publico-obtener.200-pendiente.json"
                confirmado:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/turnos-publico-obtener.200-confirmado.json"
        "404":
          description: "Token inexistente. No revela ningún dato."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                token-invalido:
                  summary: TOKEN_INVALIDO
                  externalValue: "./ejemplos/turnos-publico-obtener.404-token-invalido.json"
  "/api/public/turnos/{token}/confirmar":
    post:
      tags: ["Público"]
      operationId: turnos_publico_confirmar
      summary: "Confirmar el turno por token"
      description: "Confirma un turno `PENDIENTE` con 48 h o menos de anticipación (y antes del inicio). Orden de evaluación: (1) token inexistente, 404 `TOKEN_INVALIDO`; (2) el turno ya está en el estado destino, 200 sin efectos; (3) transición no permitida, 422 `TRANSICION_INVALIDA`; (4) plazo, 422 `*_FUERA_DE_PLAZO`."
      security: []
      parameters:
        - "$ref": "#/components/parameters/Token"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurnoResumenPublico"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/turnos-publico-confirmar.200.json"
        "404":
          description: "Token inexistente. No revela ningún dato."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                token-invalido:
                  summary: TOKEN_INVALIDO
                  externalValue: "./ejemplos/turnos-publico-confirmar.404-token-invalido.json"
        "422":
          description: "Regla de negocio violada. `TRANSICION_INVALIDA`, `CONFIRMACION_FUERA_DE_PLAZO`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                transicion-invalida:
                  summary: TRANSICION_INVALIDA
                  externalValue: "./ejemplos/turnos-publico-confirmar.422-transicion-invalida.json"
                confirmacion-fuera-de-plazo:
                  summary: CONFIRMACION_FUERA_DE_PLAZO
                  externalValue: "./ejemplos/turnos-publico-confirmar.422-confirmacion-fuera-de-plazo.json"
  "/api/public/turnos/{token}/cancelar":
    post:
      tags: ["Público"]
      operationId: turnos_publico_cancelar
      summary: "Cancelar el turno por token"
      description: "Para el paciente, confirmar es definitivo: solo se cancela un turno `PENDIENTE` con 24 h o más de anticipación. Sobre un turno `CONFIRMADO` responde 422 `TRANSICION_INVALIDA` (lo cancela el odontólogo); sobre uno ya `CANCELADO` responde 200 idempotente. Orden de evaluación: (1) token inexistente, 404 `TOKEN_INVALIDO`; (2) el turno ya está en el estado destino, 200 sin efectos; (3) transición no permitida, 422 `TRANSICION_INVALIDA`; (4) plazo, 422 `*_FUERA_DE_PLAZO`."
      security: []
      parameters:
        - "$ref": "#/components/parameters/Token"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurnoResumenPublico"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/turnos-publico-cancelar.200.json"
        "404":
          description: "Token inexistente. No revela ningún dato."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                token-invalido:
                  summary: TOKEN_INVALIDO
                  externalValue: "./ejemplos/turnos-publico-cancelar.404-token-invalido.json"
        "422":
          description: "Regla de negocio violada. `TRANSICION_INVALIDA`, `CANCELACION_FUERA_DE_PLAZO`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                transicion-invalida:
                  summary: TRANSICION_INVALIDA
                  externalValue: "./ejemplos/turnos-publico-cancelar.422-transicion-invalida.json"
                cancelacion-fuera-de-plazo:
                  summary: CANCELACION_FUERA_DE_PLAZO
                  externalValue: "./ejemplos/turnos-publico-cancelar.422-cancelacion-fuera-de-plazo.json"
  "/api/prestaciones":
    get:
      tags: [Prestaciones]
      operationId: prestaciones_listar
      summary: "Listar prestaciones"
      description: "Todas las prestaciones, activas e inactivas."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Prestacion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/prestaciones-listar.200.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
    post:
      tags: [Prestaciones]
      operationId: prestaciones_crear
      summary: "Crear prestación"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrestacionRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/prestaciones-crear.request.json"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Prestacion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/prestaciones-crear.201.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
  "/api/prestaciones/{id}":
    put:
      tags: [Prestaciones]
      operationId: prestaciones_actualizar
      summary: "Reemplazar una prestación"
      description: "PUT reemplaza el recurso completo."
      parameters:
        - "$ref": "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrestacionRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/prestaciones-actualizar.request.json"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Prestacion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/prestaciones-actualizar.200.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
    delete:
      tags: [Prestaciones]
      operationId: prestaciones_eliminar
      summary: "Eliminar una prestación"
      description: "Solo si no tiene turnos; si los tiene, 422 `PRESTACION_CON_TURNOS` (usar `activa: false`)."
      parameters:
        - "$ref": "#/components/parameters/Id"
      responses:
        "204":
          description: "Eliminado, sin contenido."
        "400":
          "$ref": "#/components/responses/SolicitudMalFormada"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "422":
          description: "Regla de negocio violada. `PRESTACION_CON_TURNOS`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                prestacion-con-turnos:
                  summary: PRESTACION_CON_TURNOS
                  externalValue: "./ejemplos/prestaciones-eliminar.422-prestacion-con-turnos.json"
  "/api/horarios-atencion":
    get:
      tags: ["Horarios de atención"]
      operationId: horarios_listar
      summary: "Listar horarios de atención"
      description: "Ordenados por día de la semana y hora de inicio."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/HorarioAtencion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/horarios-listar.200.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
    post:
      tags: ["Horarios de atención"]
      operationId: horarios_crear
      summary: "Crear horario de atención"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HorarioAtencionRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/horarios-crear.request.json"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HorarioAtencion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/horarios-crear.201.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "422":
          description: "Regla de negocio violada. `RANGO_HORARIO_INVALIDO`, `HORARIOS_SOLAPADOS`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rango-horario-invalido:
                  summary: RANGO_HORARIO_INVALIDO
                  externalValue: "./ejemplos/horarios-crear.422-rango-horario-invalido.json"
                horarios-solapados:
                  summary: HORARIOS_SOLAPADOS
                  externalValue: "./ejemplos/horarios-crear.422-horarios-solapados.json"
  "/api/horarios-atencion/{id}":
    put:
      tags: ["Horarios de atención"]
      operationId: horarios_actualizar
      summary: "Reemplazar un horario de atención"
      parameters:
        - "$ref": "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HorarioAtencionRequest"
            examples:
              ejemplo:
                summary: "Request de ejemplo"
                externalValue: "./ejemplos/horarios-actualizar.request.json"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HorarioAtencion"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/horarios-actualizar.200.json"
        "400":
          description: "Request inválido: `VALIDACION` (campo faltante o con formato inválido) o `SOLICITUD_MAL_FORMADA` (JSON ilegible o tipo incorrecto)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validacion:
                  summary: "VALIDACION con detalles"
                  externalValue: "./ejemplos/error.400-validacion.json"
                solicitud-mal-formada:
                  summary: SOLICITUD_MAL_FORMADA
                  externalValue: "./ejemplos/error.400-solicitud-mal-formada.json"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
        "422":
          description: "Regla de negocio violada. `RANGO_HORARIO_INVALIDO`, `HORARIOS_SOLAPADOS`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rango-horario-invalido:
                  summary: RANGO_HORARIO_INVALIDO
                  externalValue: "./ejemplos/horarios-actualizar.422-rango-horario-invalido.json"
                horarios-solapados:
                  summary: HORARIOS_SOLAPADOS
                  externalValue: "./ejemplos/horarios-actualizar.422-horarios-solapados.json"
    delete:
      tags: ["Horarios de atención"]
      operationId: horarios_eliminar
      summary: "Eliminar un horario de atención"
      parameters:
        - "$ref": "#/components/parameters/Id"
      responses:
        "204":
          description: "Eliminado, sin contenido."
        "400":
          "$ref": "#/components/responses/SolicitudMalFormada"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
        "404":
          "$ref": "#/components/responses/NoEncontrado"
  "/api/bloqueos":
    get:
      tags: [Bloqueos]
      operationId: bloqueos_listar
      summary: "Listar bloqueos de un rango"
      description: "Bloqueos que se superponen con el rango `desde`..`hasta` (`YYYY-MM-DD`, obligatorios, máximo 31 días)."
      parameters:
        - "$ref": "#/components/parameters/Desde"
        - "$ref": "#/components/parameters/Hasta"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Bloqueo"
              examples:
                ejemplo:
                  summary: "Respuesta de ejemplo"
                  externalValue: "./ejemplos/bloqueos-listar.200.json"
        "400":
          "$ref": "#/components/responses/Validacion"
        "401":
          "$ref": "#/components/responses/NoAutenticado"
    post:
      tags: [Bloqueos]
      operationId: bloqueos_crear
      summary: "Crear un bloqueo"
      description: "Con `cancelarTurnosAfectados: false` (por defecto) y turnos activos en el rango responde 409 `BLOQUEO_CON_TURNOS_AFECTADOS` con `turnosAfectados` y no crea el bloqueo. Con `true`, crea el bloqueo y cancela esos turnos (`canceladoPor: ODONTOLOGO`) en una transacción."
      requestBody:
        required: true
