<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Tuvimos que cancelar tu turno</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;color:#222;max-width:560px;margin:0 auto;padding:16px;">
<h2 style="margin:0 0 12px;">Tuvimos que cancelar tu turno</h2>
<p>El consultorio no atender&aacute; en el horario de tu turno y debimos cancelarlo. Disculp&aacute; las molestias; pod&eacute;s reservar un nuevo turno cuando quieras.</p>
<div th:replace="~{email/layout :: datosTurno}"></div>
<a th:replace="~{email/layout :: boton(${linkReservar}, 'Reservar un nuevo turno', '#1f618d')}"></a>
<div th:replace="~{email/layout :: contacto}"></div>
</body>
</html>
