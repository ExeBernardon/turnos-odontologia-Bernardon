<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Recordatorio de tu turno</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;color:#222;max-width:560px;margin:0 auto;padding:16px;">
<h2 style="margin:0 0 12px;">Recordatorio de tu turno</h2>
<p>Falta poco para tu turno. Por favor confirmalo, o cancelalo si no vas a poder asistir.</p>
<div th:replace="~{email/layout :: datosTurno}"></div>
<a th:replace="~{email/layout :: boton(${linkConfirmar}, 'Confirmar turno', '#1e8449')}"></a>
<a th:replace="~{email/layout :: boton(${linkCancelar}, 'Cancelar turno', '#c0392b')}"></a>
</body>
</html>
